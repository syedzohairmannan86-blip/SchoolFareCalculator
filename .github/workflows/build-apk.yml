name: Build School Fare Calculator APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q SchoolFareCalculator_PhoneOnly_AutoBuild.zip -d project

      - name: Fix Android project dependencies and resources
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("project")
          
          # Fix duplicate Kotlin JDK 7/JDK 8 classes
          build_file = root / "build.gradle"
          text = build_file.read_text()
          text += '''
          
          allprojects {
              configurations.configureEach {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }
          '''
          build_file.write_text(text)

          # Add missing black color
          colors = root / "app/src/main/res/values/colors.xml"
          text = colors.read_text()
          text = text.replace(
              '</resources>',
              '    <color name="black">#000000</color>\\n</resources>'
          )
          colors.write_text(text)
          PY

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SchoolFareCalculator-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build School Fare Calculator APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q SchoolFareCalculator_DarkEdition_v3_Landscape.zip -d project
      - name: Fix Android project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("project")

          # Fix icon location
          drawable = root / "app/src/main/res/drawable"
          drawable.mkdir(parents=True, exist_ok=True)

          old_icon = root / "app/src/main/res/drawable_icon.xml"
          new_icon = drawable / "drawable_icon.xml"

          if old_icon.exists():
              old_icon.rename(new_icon)

          # Fix theme name
          themes = root / "app/src/main/res/values/themes.xml"
          text = themes.read_text()
          text = text.replace(
              'name="Theme.SchoolFare"',
              'name="Theme.SchoolFareCalculator"'
          )
          themes.write_text(text)

          # Add missing black color
          colors = root / "app/src/main/res/values/colors.xml"
          text = colors.read_text()

          if 'name="black"' not in text:
              text = text.replace(
                  '</resources>',
                  '    <color name="black">#000000</color>\n</resources>'
              )

          colors.write_text(text)

          # Remove conflicting old Kotlin JDK dependencies
          build_file = root / "build.gradle"
          text = build_file.read_text()

          if 'kotlin-stdlib-jdk7' not in text:
              text += '''

          allprojects {
              configurations.configureEach {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }
          '''

          build_file.write_text(text)
          PY

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SchoolFareCalculator-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
